<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Explorer</title>
    <style>
      .hidden {
        display: none;
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-dark text-light">
    <main class="container py-4">
      <h1 class="h3 fw-bold text-white mb-0">Movie List</h1>
      <div id="catalog-view">
        <button id="filter-favs-btn" class="btn btn-primary">Ver Favoritos</button>
        <button id="show-all-btn" class="btn btn-primary">Ver Todas</button>
        <form id="search-form">
          <input type="text" id="search-input" placeholder="Buscar pelicula..." class="form-control bg-dark text-white border-secondary"/>
        </form>
        <div id="movies-container" class="row g-4"></div>
      </div>
      <div id="detail-view" class="hidden"></div>
    </main>
  </body>
  <script type="module" src="./dist/index.js"></script>
</html>
